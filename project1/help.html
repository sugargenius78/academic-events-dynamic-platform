<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ACADEMIC EVENTS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form action="support.php" method="post" class="help-box">
            <h1>Support/Feedback</h1>
            <h2>Contact Support</h2>
            <p>If you have any question or need help, feel free to send us a message below.</p>
            <h3>Message:</h3>
            <textarea name="message" placeholder="write your message here..." rows="10" cols="100" required></textarea> 
            <h3>Name</h3>
            <input type="text" name="name" placeholder="write your name.">
            <h3>Email</h3>
            <input type="email" name="email" placeholder="Write your email." required>
            <a href="form.html"><button type="submit" class="event-button">Submit</button></a>
        </form>
    
    </body>
</html>
